name: Build Windows installer
on:
  workflow_dispatch:
    inputs:
      source_url:
        description: HTTPS URL of the signed source MSIX matching config/windows-target.json
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare Bun and test dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'bun.zip'
          Invoke-WebRequest 'https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-windows-x64.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne 'ce4c17497b2f29712a99d3d53f028de28cd42e3bacb8589599e7f000e49b6405') { throw 'Bun archive checksum mismatch' }
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'bun')
          (Join-Path $env:RUNNER_TEMP 'bun\bun-windows-x64') | Out-File $env:GITHUB_PATH -Append
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Python dependencies failed' }
          "CODEX_HEBREW_PYTHON=$((Get-Command python).Source)" | Out-File $env:GITHUB_ENV -Append
      - name: Download and verify source package
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (([uri]$env:SOURCE_URL).Scheme -ne 'https') { throw 'Source URL must use HTTPS' }
          $package = Join-Path $env:RUNNER_TEMP 'source.msix'
          Invoke-WebRequest $env:SOURCE_URL -OutFile $package
          $signTool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$signTool) { throw 'Windows SDK signature verifier missing' }
          & $signTool.FullName verify /pa /v $package
          if ($LASTEXITCODE -ne 0) { throw 'Source package signature is invalid' }
          $source = Join-Path $env:RUNNER_TEMP 'codex-source'
          [IO.Compression.ZipFile]::ExtractToDirectory($package, $source)
          $target = Get-Content config/windows-target.json -Raw | ConvertFrom-Json
          [xml]$manifest = Get-Content (Join-Path $source 'AppxManifest.xml') -Raw
          if ($manifest.Package.Identity.Name -ne 'OpenAI.Codex' -or $manifest.Package.Identity.Version -ne $target.packageVersion) { throw 'Unexpected source package identity/version' }
          $exe = Join-Path $source 'app\ChatGPT.exe'
          if (!(Test-Path $exe)) { throw 'Source executable missing' }
          if ((Get-FileHash (Join-Path $source 'app\resources\app.asar') -Algorithm SHA256).Hash -ne $target.archiveSha256) { throw 'Source ASAR checksum mismatch' }
          "SOURCE_EXECUTABLE=$exe" | Out-File $env:GITHUB_ENV -Append
      - name: Test maintained source
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Bun dependencies failed' }
          bun test
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          bun run check:structure
          if ($LASTEXITCODE -ne 0) { throw 'Structure check failed' }
      - name: Build and verify installer
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content config/windows-target.json -Raw | ConvertFrom-Json).packageVersion
          $setup = Join-Path $env:GITHUB_WORKSPACE "dist\windows-release\Codex-Hebrew-Setup-$version.exe"
          bun run build:windows-installer $env:SOURCE_EXECUTABLE $setup
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          & scripts/validation/check-windows-installer.ps1 -Setup $setup -SourceExecutable $env:SOURCE_EXECUTABLE -TestRoot (Join-Path $env:RUNNER_TEMP 'installer-acceptance')
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($setup))" | Set-Content "$setup.sha256" -Encoding ascii
          Copy-Item (Join-Path $env:RUNNER_TEMP 'installer-acceptance\verification.json') 'dist\windows-release\verification.json'
          $env:GITHUB_SHA | Set-Content 'dist\windows-release\source-commit.txt' -Encoding ascii
      - name: Upload verified installer only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installer
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/windows-release/*.exe
            dist/windows-release/*.exe.sha256
            dist/windows-release/*.exe.json
            dist/windows-release/verification.json
            dist/windows-release/source-commit.txt
