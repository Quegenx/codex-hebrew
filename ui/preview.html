<!doctype html>
<html lang="en" dir="ltr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChatGPT eBrew — local preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#171819;color:#ececec;font:16px system-ui}button,textarea{font:inherit;color:inherit;background:#303234;border:1px solid #555;border-radius:10px;padding:10px}button{cursor:pointer}.layout{display:flex;min-height:100vh}.sidebar{width:220px;flex-shrink:0;padding:24px;border-inline-end:1px solid #444;background:#202223}.main{padding:36px;max-width:900px;flex:1;min-width:0}.row{display:flex;justify-content:flex-start;gap:12px;align-items:center}h1{font-size:26px}p{line-height:1.7}pre{padding:16px;background:#080909;overflow:auto;border-radius:12px}textarea{width:100%;margin-block:16px}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:start;border-block-end:1px solid #444}.badge{background:#174b3b;padding:5px 12px;border-radius:16px}.toolbar{display:flex;gap:12px;margin-block-end:24px;flex-wrap:wrap}@media(max-width:600px){.sidebar{width:125px;padding:12px}.main{padding:16px}}
</style>
<div class="layout"><aside class="sidebar"><h2>ChatGPT eBrew</h2><button data-message-id="chatgptConversations.newChat">New chat</button><p><button data-message-id="appgenPage.settings.label">Settings</button></p></aside>
<main class="main"><div class="toolbar"><button id="enable">עברית / RTL</button><button id="disable">English / LTR</button><button id="dynamic">הוספת רכיב</button></div>
<h1>בדיקת עברית וכיווניות</h1><p>זוהי סביבת בדיקה מקומית. החיבור לממשק ChatGPT נבדק בנפרד.</p>
<div class="row" id="flex-row"><span class="badge" id="first">ראשון</span><span id="second">שני</span></div>
<textarea placeholder="כתבו בעברית או באנגלית" aria-label="הודעה"></textarea>
<p data-rtl-user-content>עברית עם OpenAI ועם המספר 12345.</p>
<pre><code>const greeting = "שלום";
console.log(greeting);</code></pre>
<p><bdi data-rtl-ltr>https://example.com/path?q=hello</bdi></p>
<table><thead><tr><th>שם</th><th>מצב</th></tr></thead><tbody><tr><td>עברית</td><td>בדיקה</td></tr></tbody></table>
<button data-message-id="annotationCommentComposer.cancel">Cancel</button><div id="added"></div></main></div>
<script type="module">
import {installRTL} from '/adapter.js';
const [css,translations] = await Promise.all([fetch('/rtl.css').then(r=>r.text()),fetch('/translations.json').then(r=>r.json())]);
const enable=()=>installRTL({css,translations});document.querySelector('#enable').onclick=enable;
document.querySelector('#disable').onclick=()=>window.chatgptRTL?.stop();
document.querySelector('#dynamic').onclick=()=>{const b=document.createElement('button');b.dataset.messageId='annotationCommentComposer.cancel';b.textContent='Cancel';document.querySelector('#added').append(b);};
enable();
</script></html>
